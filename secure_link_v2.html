<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureLink — 加密通道（WebRTC 点对点）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; padding:16px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color:#94a3b8; font-size: 13px; margin-bottom: 14px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; margin-bottom:12px; }
  .card h2 { font-size: 15px; margin-bottom: 8px; color:#7dd3fc; }
  .stepnum { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; background:#0284c7; color:#fff; border-radius:50%; font-size:12px; margin-right:6px; }
  label { display:block; font-size:13px; margin:8px 0 4px; color:#cbd5e1; }
  input[type=text], input[type=password], textarea { width:100%; background:#0f172a; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:8px; font-size:13px; }
  textarea { height:100px; font-family:monospace; resize:vertical; }
  button { background:#0284c7; color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; margin:6px 6px 0 0; }
  button:hover { background:#0369a1; }
  button:disabled { background:#475569; cursor:not-allowed; }
  .btn-sec { background:#059669; } .btn-sec:hover{ background:#047857; }
  .btn-grey { background:#334155; } .btn-grey:hover{ background:#475569; }
  .status { font-size:13px; margin-top:8px; color:#fbbf24; min-height:18px; }
  .ok { color:#34d399; } .err { color:#f87171; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .sigbox { position:relative; }
  .qrcode { display:none; margin-top:8px; text-align:center; }
  .qrcode canvas { background:#fff; padding:6px; border-radius:8px; }
  #chat { height: 220px; overflow-y:auto; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:10px; font-size:13px; margin-top:8px; }
  .msg { margin:3px 0; word-break:break-all; }
  .peer { color:#93c5fd; } .me { color:#fbbf24; }
  .sys { color:#64748b; font-size:12px; }
  .time { color:#475569; font-size:11px; margin-right:6px; }
  #input { display:flex; gap:8px; margin-top:8px; }
  #input input { flex:1; }
  #drop { border:2px dashed #334155; border-radius:10px; padding:14px; text-align:center; color:#94a3b8; font-size:13px; margin-top:8px; transition:.2s; }
  #drop.over { border-color:#0284c7; color:#7dd3fc; background:#0b1526; }
  .progress { background:#0f172a; border:1px solid #334155; border-radius:8px; height:18px; margin-top:6px; overflow:hidden; }
  .bar { height:100%; width:0%; background:#0284c7; transition:width .2s; }
  .fitem { font-size:13px; margin-top:6px; color:#cbd5e1; }
  a.dl { color:#34d399; }
  .tip { color:#94a3b8; font-size:12px; line-height:1.7; }
  .qbtn { background:#0f172a; border:1px solid #334155; color:#7dd3fc; }
  .hidden { display:none !important; }
  .badge { font-size:11px; background:#334155; color:#e2e8f0; border-radius:4px; padding:1px 6px; margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 SecureLink 加密通道</h1>
  <div class="sub">WebRTC 点对点直连 · AES-256-GCM 全加密 · 文本 / 大文件分块传输 · 无服务器 · 局域网与公网皆可</div>

  <div class="card">
    <h2><span class="stepnum">1</span>设置口令</h2>
    <label>加密口令（双方必须一致）</label>
    <input type="password" id="pass" placeholder="输入口令，例如：my-secret-2026">
    <div class="status" id="connStatus">未连接。千里之外也能直连：内置 STUN 自动打洞，打洞失败可用下方 TURN 中继。</div>
    <button class="btn-sec" id="btnOffer">我是发起方：创建连接</button>
    <button class="btn-sec" id="btnAnswer" disabled>我是接收方：接受并生成应答</button>
    <label style="margin-top:10px">TURN 中继服务器（可选，公网打洞失败时兜底；格式 turn:用户:密码@主机:端口）</label>
    <input type="text" id="turn" placeholder="留空则使用默认 STUN 直连；需要时填自建 coturn，如 turn:user:pass@1.2.3.4:3478">
  </div>

  <div class="card hidden" id="sigCard">
    <h2><span class="stepnum">2</span>交换信令（复制文本 或 扫码）</h2>
    <div class="row">
      <div class="sigbox">
        <label>我的信令 <span class="badge" id="mySigRole"></span></label>
        <textarea id="mySig" readonly placeholder="点击上方按钮后自动生成"></textarea>
        <button id="btnCopySig">复制我的信令</button>
        <button id="btnQrSig" class="qbtn">显示/隐藏二维码</button>
        <div class="qrcode" id="qrSig"><div id="qrSigBox"></div><div class="tip">对方可用手机扫码获取信令文本</div></div>
      </div>
      <div>
        <label>对方信令（粘贴后自动处理）</label>
        <textarea id="peerSig" placeholder="粘贴对方发来的信令文本"></textarea>
        <button id="btnApplySig" disabled>应用对方信令</button>
      </div>
    </div>
    <div class="tip">流程：发起方点“创建连接”→ 把信令发给对方 → 对方粘贴（自动应答）→ 把应答发回 → 发起方粘贴（自动应用）。公网远端可用微信/QQ 传信令文本或二维码。</div>
  </div>

  <div class="card hidden" id="chatCard">
    <h2><span class="stepnum">3</span>加密通讯</h2>
    <div id="chat"></div>
    <div class="row" id="input">
      <input type="text" id="msg" placeholder="输入消息回车发送">
      <input type="file" id="file" multiple style="display:none">
      <button id="btnFile">选择文件</button>
    </div>
    <div id="drop">或将文件拖到这里发送（支持多文件、大文件）</div>
    <div class="fitem" id="fileInfo"></div>
    <div class="progress hidden" id="progWrap"><div class="bar" id="progBar"></div></div>
    <div class="fitem" id="recvFiles"></div>
  </div>
</div>

function randHex(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hex2buf(h){ const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(h.slice(i*2,i*2+2),16); return a; }
function buf2hex(b){ return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function now(){ const d=new Date(); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); }

async function deriveKey(pass, saltHex){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt: hex2buf(saltHex), iterations: 120000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function aesEncrypt(plainBytes){
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv:nonce}, aesKey, plainBytes));
  const out = new Uint8Array(12 + ct.length); out.set(nonce,0); out.set(ct,12); return out;
}
async function aesDecrypt(blob){
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:blob.slice(0,12)}, aesKey, blob.slice(12)));
}
function frame(typ, payload){
  const out = new Uint8Array(5 + payload.length);
  out[0]=typ; new DataView(out.buffer).setUint32(1, payload.length, false); out.set(payload,5); return out.buffer;
}
function parseFrame(buf){
  const u = new Uint8Array(buf);
  const len = new DataView(u.buffer, u.byteOffset, 5).getUint32(1, false);
  return { typ:u[0], payload:u.slice(5, 5+len) };
}
function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}

/* ================= ICE 配置（STUN 打洞 + 可选 TURN 中继） ================= */
function iceServers(){
  const servers = [{ urls: 'stun:stun.l.google.com:19302' }];
  const turn = $('turn').value.trim();
  if (turn.startsWith('turn:') || turn.startsWith('turns:')){
    const m = turn.match(/^(turns?):(.*)$/);
    let url = turn, un, pw;
    const at = turn.indexOf('@');
    if (at > 0){
      const cred = turn.slice(5, at), idx = cred.indexOf(':');
      if (idx > 0){ un = cred.slice(0,idx); pw = cred.slice(idx+1); url = 'turn:' + turn.slice(at+1); }
    }
    servers.push({ urls:url, username:un, credential:pw });
  }
  return servers;
}
function makePC(){ return new RTCPeerConnection({ iceServers: iceServers() }); }

/* ================= 信令 ================= */
function buildSignal(pc, saltHex, type){ return JSON.stringify({ app:'secure-link', salt:saltHex, type, sdp: pc.localDescription.sdp }); }
function parseSignal(text){ try { const o = JSON.parse(text.trim()); if (o.app !== 'secure-link' || !o.salt || !o.sdp) throw 0; return o; } catch(e){ return null; } }
function gatherComplete(p){
  return new Promise(res => {
    let done = false;
    const t = setTimeout(()=>{ if(!done){done=true; res();} }, 4000);
    p.onicecandidate = e => { if (e.candidate === null && !done){ done=true; clearTimeout(t); res(); } };
  });
}

async function doOffer(){
  const pass = $('pass').value;
  if (!pass){ setStatus('请先输入口令', true); return; }
  role = 'offer'; mySalt = randHex(16);
  aesKey = await deriveKey(pass, mySalt);
  pc = makePC();
  dc = pc.createDataChannel('secure', { ordered:true });
  wireDC(dc); wirePC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await gatherComplete(pc);
  $('mySig').value = buildSignal(pc, mySalt, 'offer');
  $('mySigRole').textContent = '发起方';
  $('btnCopySig').disabled = false; $('btnQrSig').disabled = false; $('btnAnswer').disabled = false;
  $('sigCard').classList.remove('hidden');
  setStatus('已生成连接，把“我的信令”复制或扫码发给对方', false);
}

async function doAnswer(){
  const sig = parseSignal($('peerSig').value), pass = $('pass').value;
  if (!sig){ setStatus('对方信令格式无效', true); return; }
  if (!pass){ setStatus('请先输入口令', true); return; }
  if (sig.type !== 'offer'){ setStatus('请粘贴发起方的 offer 信令', true); return; }
  if (pc && role === 'answer'){ setStatus('已接受过连接，请勿重复操作', true); return; }
  role = 'answer'; mySalt = sig.salt;
  aesKey = await deriveKey(pass, mySalt);
  pc = makePC(); wirePC();
  pc.ondatachannel = ev => { dc = ev.channel; wireDC(dc); };
  await pc.setRemoteDescription({ type:'offer', sdp:sig.sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await gatherComplete(pc);
  $('mySig').value = buildSignal(pc, mySalt, 'answer');
  $('mySigRole').textContent = '接收方';
  $('btnCopySig').disabled = false; $('btnQrSig').disabled = false; $('btnApplySig').disabled = true;
  $('sigCard').classList.remove('hidden');
  setStatus('已接受，把应答信令发回发起方', false);
}

async function applySignal(){
  const sig = parseSignal($('peerSig').value);
  if (!sig){ setStatus('对方信令格式无效', true); return; }
  if (sig.type !== 'answer'){ setStatus('请粘贴接收方的 answer 信令', true); return; }
  if (!pc){ setStatus('请先点击“创建连接”', true); return; }
  if (mySalt !== sig.salt){ setStatus('信令不匹配：请使用同一次会话的应答', true); return; }
  await pc.setRemoteDescription({ type:'answer', sdp:sig.sdp });
  setStatus('应答已应用，正在建立加密通道…', false);
}

function wirePC(){
  pc.onconnectionstatechange = () => {
    setStatus('连接状态: ' + pc.connectionState, pc.connectionState==='failed' || pc.connectionState==='disconnected');
    if (pc.connectionState === 'connected'){ connected = true; showChat(); }
  };
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'failed')
      setStatus('ICE 打洞失败：可填写 TURN 中继服务器后重新连接', true);
  };
}

/* ================= 数据通道 ================= */
function wireDC(d){
  d.binaryType = 'arraybuffer';
  d.onopen = () => { setStatus('加密通道已建立 ✓', false); showChat(); };
  d.onclose = () => setStatus('通道已关闭', true);
  d.onmessage = async ev => {
    try {
      const f = parseFrame(ev.data);
      if (f.typ === FT_MSG){
        const plain = await aesDecrypt(f.payload);
        addMsg('对方', new TextDecoder().decode(plain));
      } else if (f.typ === FT_FM){
        const meta = JSON.parse(new TextDecoder().decode(await aesDecrypt(f.payload)));
        pendingFile = { name: meta.name, size: meta.size, got: 0, chunks: [], useSink: false };
        if (window.showSaveFilePicker){
          try {
            const h = await showSaveFilePicker({ suggestedName: meta.name });
            pendingFile.sink = await h.createWritable();
            pendingFile.useSink = true;
          } catch(e){ pendingFile.sink = null; } // 用户取消 → 内存方案
        }
        showProg(0, '接收中: ' + meta.name + ' (0/' + fmtSize(meta.size) + ')');
      } else if (f.typ === FT_FD){
        if (!pendingFile) return;
        const blk = await aesDecrypt(f.payload);
        if (pendingFile.useSink) await pendingFile.sink.write(blk);
        else pendingFile.chunks.push(blk);
        pendingFile.got += blk.length;
        showProg(pendingFile.got / pendingFile.size, '接收中: ' + pendingFile.name + ' (' + fmtSize(pendingFile.got) + '/' + fmtSize(pendingFile.size) + ')');
      } else if (f.typ === FT_FE){
        await aesDecrypt(f.payload);
        if (pendingFile){
          let saved;
          if (pendingFile.useSink){ await pendingFile.sink.close(); saved = '（已流式写入磁盘，不占内存）'; }
          else {
            const blob = new Blob(pendingFile.chunks);
            const url = URL.createObjectURL(blob);
            const el = document.createElement('div');
            el.className = 'fitem';
            el.innerHTML = '✓ 收到文件 <a class="dl" href="' + url + '" download="' + pendingFile.name + '">' + pendingFile.name + '</a> (' + fmtSize(pendingFile.size) + ')';
            $('recvFiles').appendChild(el);
            saved = '';
          }
          addSys('文件接收完成: ' + pendingFile.name + ' ' + saved);
          pendingFile = null; showProg(0, '');
        }
      }
    } catch(e){ addSys('解密失败：口令不一致或数据被篡改'); }
  };
}

/* ================= 发送 ================= */
async function sendTyped(typ, plainBytes){
  const enc = await aesEncrypt(plainBytes);
  if (dc.bufferedAmount > BACKPRESSURE){
    await new Promise(res => {
      const iv = setInterval(() => { if (dc.bufferedAmount <= BACKPRESSURE/2){ clearInterval(iv); res(); } }, 50);
    });
  }
  dc.send(frame(typ, enc));
}
function sendText(){
  const v = $('msg').value;
  if (!v.trim() || !dc || dc.readyState !== 'open') return;
  sendTyped(FT_MSG, new TextEncoder().encode(v));
  addMsg(nick, v); $('msg').value = '';
}
async function sendOne(file){
  const meta = JSON.stringify({ name:file.name, size:file.size });
  await sendTyped(FT_FM, new TextEncoder().encode(meta));
  let off = 0, t0 = performance.now();
  while (off < file.size){
    const blk = new Uint8Array(await file.slice(off, off+CHUNK).arrayBuffer());
    await sendTyped(FT_FD, blk);
    off += blk.length;
    const spd = off / 1048576 / ((performance.now()-t0)/1000 || 1);
    showProg(off/file.size, '发送中: ' + file.name + ' (' + fmtSize(off) + '/' + fmtSize(file.size) + ')  ' + spd.toFixed(1) + ' MB/s');
  }
  await sendTyped(FT_FE, new TextEncoder().encode('ok'));
  addSys('已发送文件: ' + file.name + ' (' + fmtSize(file.size) + ')');
}
function enqueueFiles(files){
  for (const f of files) sendQueue.push(f);
  if (!sending) pumpQueue();
}
async function pumpQueue(){
  sending = true;
  while (sendQueue.length){
    const f = sendQueue.shift();
    try { await sendOne(f); } catch(e){ addSys('发送失败: ' + f.name); }
  }
  sending = false; showProg(0, '');
}

/* ================= UI ================= */
function setStatus(t, err){ const s=$('connStatus'); s.className='status '+(err?'err':'ok'); s.textContent=t; }
function showChat(){ $('chatCard').classList.remove('hidden'); }
function addMsg(who, text){
  const d=document.createElement('div'); d.className='msg';
  d.innerHTML='<span class="time">['+now()+']</span><span class="'+(who===nick?'me':'peer')+'">'+who+':</span> '+escapeHtml(text);
  $('chat').appendChild(d); $('chat').scrollTop=$('chat').scrollHeight;
}
function addSys(text){
  const d=document.createElement('div'); d.className='msg sys';
  d.textContent='['+now()+'] · '+text;
  $('chat').appendChild(d); $('chat').scrollTop=$('chat').scrollHeight;
}
function showProg(p, info){
  if (p>0){ $('progWrap').classList.remove('hidden'); $('progBar').style.width=Math.round(p*100)+'%'; }
  else { $('progWrap').classList.add('hidden'); $('progBar').style.width='0%'; }
  $('fileInfo').textContent = info || '';
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showQr(){
  const box = $('qrSig');
  if (box.style.display !== 'none'){ box.style.display='none'; return; }
  const text = $('mySig').value;
  if (!text){ addSys('暂无信令可生成二维码'); return; }
  const qr = qrcode(0, 'M');
  qr.addData(text); qr.make();
  box.innerHTML = '';
  const cell = 4, size = qr.getModuleCount()*cell;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#000';
  for (let r=0; r<qr.getModuleCount(); r++)
    for (let c=0; c<qr.getModuleCount(); c++)
      if (qr.isDark(r,c)) ctx.fillRect(c*cell, r*cell, cell, cell);
  box.appendChild(canvas);
  box.style.display = 'block';
}

/* ================= 事件 ================= */
$('btnOffer').onclick = doOffer;
$('btnAnswer').onclick = doAnswer;
$('btnApplySig').onclick = applySignal;
$('btnCopySig').onclick = () => { $('mySig').select(); document.execCommand('copy'); addSys('信令已复制'); };
$('btnQrSig').onclick = showQr;
$('btnFile').onclick = () => $('file').click();
$('file').onchange = () => { if ($('file').files.length) enqueueFiles([...$('file').files]); $('file').value=''; };
$('msg').onkeydown = e => { if (e.key==='Enter') sendText(); };
$('peerSig').oninput = async () => {
  const sig = parseSignal($('peerSig').value);
  $('btnApplySig').disabled = !sig;
  if (sig && sig.type === 'offer' && !pc && $('pass').value){ await doAnswer(); }
  else if (sig && sig.type === 'answer' && pc && role === 'offer' && pc.connectionState !== 'connected'){ await applySignal(); }
};
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) enqueueFiles([...e.dataTransfer.files]); };
</script>
